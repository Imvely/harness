# LMDB backend: the dataset is packed into one memory-mapped key/value store.
#
#   export PAD_LMDB_PATH=/path/to/oulu_npu.lmdb      # a directory (data.mdb) or a single .mdb
#   uv run --no-sync python scripts/check_storage.py --storage lmdb --dataset-id oulu_npu
#
# The manifest's `relative_path` IS the key, so the LMDB layout needs no extra configuration —
# it is already described by each record's `media_type`:
#
#   media_type: video       -> the key holds one encoded video
#   media_type: frames_dir  -> the key is a PREFIX; `<prefix>/<frame>` keys hold the frames
#   media_type: image       -> the key holds one still
#   media_type: npy_clip    -> the key holds a serialized .npy clip
#
# Use key_prefix/key_suffix only when the store was built with an affix the manifest does not
# carry; `scripts/check_storage.py` reports exactly this mismatch.
kind: lmdb
path_env_var: PAD_LMDB_PATH
key_prefix: ""
key_suffix: ""
key_encoding: utf-8
# false is correct for a finished store: it skips the reader lock table, so a read-only mount
# works and many DataLoader workers cannot exhaust reader slots. Set true ONLY while another
# process is still writing the store.
lock: false
readahead: false
max_readers: 2048
