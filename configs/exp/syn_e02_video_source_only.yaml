# @package _global_
# E02 (contract §43): video baseline (8 frames), source-only. Same protocol as E01/E03 -> directly comparable.
defaults:
  - override /model: video_baseline
  - override /data: synthetic
  - override /adaptation: none
  - override /protocol: syn_a_to_b_bf_adapt_v1
experiment:
  id: exp_syn_e02_video_source_only
  title: synthetic_video_baseline_source_only
  hypothesis: "Pipeline sanity for E02 (video baseline, 8 frames). Not a research result."
  research_question: RQ1
  parent_experiment_id: exp_syn_e01_frame_source_only
training:
  seed: 42
  epochs: 2
  batch_size: 8
  learning_rate: 1.0e-3
execution:
  mode: smoke
  allow_full_gpu_run: false
  require_gpu: false
  expected_gpu: null
  smoke:
    # Each synthetic eval split holds 32 clips with exactly 4 replay_phone and 4 replay_tablet
    # attacks, and the security gate needs min_attack_samples_per_pai=4, so a smoke evaluation
    # has to read the whole split: 4 batches x batch_size 8. Anything smaller truncates a PAI
    # below its support floor and the gate can only answer "inconclusive".
    max_eval_batches: 4
tracking:
  mlflow_experiment: pad-synthetic-sanity
