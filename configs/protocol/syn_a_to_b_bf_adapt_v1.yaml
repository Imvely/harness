# Synthetic sanity protocol with a bona-fide-only adaptation budget (24 target train clips).
# Source-only control arms (adaptation: none) run under THIS protocol too, so E01/E02/E03 share protocol_hash
# and the security gate can compare them directly (contract §14.3, ADR-004).
protocol_id: syn_a_to_b_bf_adapt_v1
schema_version: 1
status: active
description: "Synthetic sanity: A -> B with bona-fide-only adaptation budget (24 samples), adaptation samples excluded from test"
parent_protocol_id: syn_a_to_b_v1
change_note: "target_adaptation.enabled false -> true (bona_fide_only, total_samples 24, source_split train)"
source_datasets: [synthetic_a]
target_dataset: [synthetic_b]
source_classes: [bona_fide, spoof]
target_adaptation:
  enabled: true
  supervision: bona_fide_only
  shots_per_subject: null
  total_samples: 24                   # 12 train subjects x 4 bona_fide = 48 candidates in synthetic_b/train
  source_split: train
  selection_seed: 0
  subject_disjoint_from_test: true
target_test:
  exclude_adaptation_samples: true
  split: test
attack_types: [print, replay_phone, replay_tablet]
threshold:
  source: dev_set
  policy: fixed_after_dev
  rule: eer
  rule_param: null
  dev_domain: source
acer_policy: max_pai
security_gate:
  abs_tolerance: 0.01
  rel_tolerance: 0.0
  min_attack_samples_per_pai: 4
allow_image_dataset_as_clip: false
